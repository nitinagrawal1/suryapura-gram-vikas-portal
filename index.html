function Icon({ name, size = 20, className = '', filled = false, strokeWidth = 2 }) {
  const content = ICONS[name];
  if (!content) return null;
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
      fill={filled ? 'currentColor' : 'none'}
      stroke={filled ? 'none' : 'currentColor'}
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={className} aria-hidden="true">
      {content}
    </svg>
  );
}

/* Real image with automatic fallback chain — never shows a broken box */
function SmartImage({ img, className = '', fit = 'cover', eager = false }) {
  const [idx, setIdx] = useState(0);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { setIdx(0); setLoaded(false); }, [img]);
  const src = img.sources[idx];
  if (!src) {
    return (
      <div className={`bg-brand-green flex items-center justify-center ${className}`} role="img" aria-label={img.alt}>
        <div className="text-center px-3">
          <Icon name="sun" size={26} className="mx-auto text-brand-saffronLight" />
          <p className="text-white/80 text-[11px] mt-1 font-display tracking-wide">सूर्यपुरा</p>
        </div>
      </div>
    );
  }
  return (
    <img key={src} src={src} alt={img.alt} loading={eager ? 'eager' : 'lazy'} decoding="async" draggable={false}
      onLoad={() => setLoaded(true)}
      onError={() => setIdx(i => i + 1)}
      className={`${fit === 'contain' ? 'object-contain' : 'object-cover'} transition-opacity duration-500 ${loaded ? 'opacity-100' : 'opacity-0'} ${className}`} />
  );
}

/* Portal emblem — rising sun over green fields */
function Emblem({ size = 44, className = '' }) {

/* Generic modal (dialog + overlay + Escape + inner scroll) */
function Modal({ open, onClose, children, wide = 'max-w-2xl', label = 'संवाद' }) {
  useEffect(() => {
    if (!open) return;
    const h = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', h);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', h); document.body.style.overflow = ''; };
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[90] flex items-center justify-center p-4 md:p-6" role="dialog" aria-modal="true" aria-label={label}>
      <div className="absolute inset-0 bg-brand-deep/70 backdrop-blur-sm" onClick={onClose} />
      <div className={`relative w-full ${wide} bg-white rounded-2xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col animate-pop`}>
        <button onClick={onClose} aria-label="बंद करें"
          className="absolute top-3 right-3 z-10 w-9 h-9 rounded-full bg-white/95 shadow-md flex items-center justify-center text-brand-deep hover:bg-brand-cream transition-colors">
          <Icon name="x" size={17} />
        </button>
        <div className="overflow-y-auto">{children}</div>
      </div>
    </div>
  );
}

/* Full-screen photo lightbox with prev/next + keyboard */
function Lightbox({ data, onClose, onNav }) {
  useEffect(() => {
    if (!data) return;
    const h = e => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowRight') onNav(1);
      if (e.key === 'ArrowLeft') onNav(-1);
    };
    document.addEventListener('keydown', h);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', h); document.body.style.overflow = ''; };
  }, [data, onClose, onNav]);
  if (!data) return null;
  const item = data.list[data.index];
  const n = data.list.length;
  return (
    <div className="fixed inset-0 z-[95] bg-brand-deep/95 flex items-center justify-center p-4 md:p-10 animate-pop" role="dialog" aria-modal="true" aria-label="फोटो दर्शक">
      <button onClick={onClose} aria-label="बंद करें"
        className="absolute top-4 right-4 w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors">
        <Icon name="x" size={18} />
      </button>
      <button onClick={() => onNav(-1)} aria-label="पिछली तस्वीर"
        className="absolute left-2 md:left-8 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors z-10">
        <Icon name="chevronLeft" size={20} />
      </button>
      <button onClick={() => onNav(1)} aria-label="अगली तस्वीर"
        className="absolute right-2 md:right-8 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition-colors z-10">
        <Icon name="chevronRight" size={20} />
      </button>
      <figure className="max-w-4xl w-full text-center">
        <SmartImage img={item.img} fit="contain" className="w-full h-[62vh] md:h-[72vh] rounded-lg bg-brand-deep" />
        <figcaption className="mt-4 text-white/85 font-serifhi italic flex items-center justify-center gap-2 text-sm">

          {item.caption}
          <span className="text-white/40 not-italic text-xs">({data.index + 1}/{n})</span>
        </figcaption>
      </figure>
    </div>
  );
}

function SearchOverlay({ open, q, setQ, close, goTo }) {
  const r = useRef(null);
  useEffect(() => { if (open && r.current) r.current.focus(); }, [open]);
  useEffect(() => {
    if (!open) return;
    const h = e => { if (e.key === 'Escape') close(); };
    window.addEventListener('keydown', h);
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', h); document.body.style.overflow = ''; };
  }, [open, close]);
  if (!open) return null;
  const ql = q.trim().toLowerCase();
  const results = ql
    ? SEARCH.filter(s => s.label.toLowerCase().includes(ql) || s.kw.some(k => k.toLowerCase().includes(ql)))
    : SEARCH;
  const go = id => { close(); setQ(''); goTo(id); };
  return (
    <div className="fixed inset-0 z-[85]" role="dialog" aria-modal="true" aria-label="खोज">
      <div className="absolute inset-0 bg-brand-deep/60 backdrop-blur-sm" onClick={close} />
      <div className="relative bg-white shadow-2xl rounded-b-3xl animate-pop max-h-[80vh] flex flex-col">
        <form onSubmit={e => { e.preventDefault(); if (results.length) go(results[0].id); }}
          className="flex items-center gap-3 px-4 md:px-6 py-4 border-b border-brand-sand">
          <Icon name="search" size={18} className="text-brand-saffron shrink-0" />
          <input ref={r} value={q} onChange={e => setQ(e.target.value)}
            placeholder="खोजें — जैसे “किसान”, “स्कूल”, “सड़क”…"
            aria-label="पोर्टल में खोजें"
            className="flex-1 min-w-0 text-base md:text-lg bg-transparent py-1 focus:outline-none placeholder:text-ink/35 text-ink" />
          <button type="button" onClick={close} aria-label="खोज बंद करें"
            className="w-9 h-9 rounded-full border border-brand-sand flex items-center justify-center text-ink/60 hover:bg-brand-cream transition-colors shrink-0">
            <Icon name="x" size={16} />
          </button>
        </form>
        <div className="overflow-y-auto p-3 md:p-4">
          <p className="px-2 pb-2 text-xs font-bold tracking-wider text-ink/45">
            {ql ? `“${q.trim()}” के लिए ${results.length} परिणाम` : 'सभी खंड ब्राउज़ करें'}
          </p>
          {results.length === 0 ? (
            <p className="px-3 py-8 text-sm text-ink/55 text-center">कोई परिणाम नहीं मिला — “किसान”, “शिक्षा” या “समाचार” आज़माएं।</p>
          ) : (
            <ul className="grid sm:grid-cols-2 gap-1.5">
              {results.map(s => (
                <li key={s.id}>
                  <button onClick={() => go(s.id)}
                    className="w-full text-left px-3.5 py-3 rounded-xl hover:bg-brand-cream flex items-center gap-3 group transition-colors">
                    <span className="w-8 h-8 rounded-lg bg-brand-cream border border-brand-sand text-brand-green flex items-center justify-center shrink-0 group-hover:bg-brand-green group-hover:text-white transition-colors">
                      <Icon name="chevronRight" size={14} />
                    </span>
                    <span className="text-[15px] font-semibold text-ink/80">{s.label}</span>
                  </button>
                </li>
              ))}
            </ul>
          )}
        </div>
      </div>
    </div>
  );
}

                <path d="M0 120 C60 100 90 60 160 70 S260 40 320 70" stroke="#E7DFCC" strokeWidth="14" fill="none" />

                <path d="M110 0 L130 190" stroke="#E7DFCC" strokeWidth="10" fill="none" />
                <circle cx="160" cy="70" r="15" fill="#E2711D" />
                <circle cx="160" cy="70" r="6" fill="#FAF7EF" />
                <text x="160" y="42" textAnchor="middle" fontSize="12" fontWeight="700" fill="#123B26" fontFamily="Mukta, sans-serif">सूर्यपुरा</text>
                <text x="286" y="185" textAnchor="end" fontSize="10" fill="#6B7A6B" fontFamily="Mukta, sans-serif">सांगानेर →</text>
                <text x="12" y="20" fontSize="10" fill="#6B7A6B" fontFamily="Mukta, sans-serif">↑ जयपुर</text>
              </svg>
              <p className="text-xs text-ink/50 text-center py-2.5 border-t border-brand-sand">अनुमानित स्थान — ग्राम पंचायत भवन के पास</p>
            </div>
          </div>

          <form onSubmit={submit} className="lg:col-span-3 bg-white border border-brand-sand rounded-2xl p-6 md:p-8 shadow-sm" noValidate>
            <h3 className="font-bold text-lg text-brand-green">संदेश भेजें</h3>
            <p className="text-sm text-ink/55 mt-1">खाली जगह भरें — पंचायत कार्यालय शीघ्र जवाब देगा।</p>
            <div className="mt-6 grid sm:grid-cols-2 gap-5">
              <div>
                <label htmlFor="c-name" className="block text-xs font-bold text-brand-green mb-1.5">आपका नाम *</label>
                <input id="c-name" type="text" value={form.name} onChange={e => set('name', e.target.value)} placeholder="जैसे — रामेश्वर लाल" className={IN} />
                {err.name && <p className="text-xs text-red-700 mt-1.5">{err.name}</p>}
              </div>
              <div>
                <label htmlFor="c-phone" className="block text-xs font-bold text-brand-green mb-1.5">मोबाइल नंबर *</label>
                <input id="c-phone" type="tel" inputMode="numeric" value={form.phone} onChange={e => set('phone', e.target.value)} placeholder="10 अंकों का नंबर" className={IN} />
                {err.phone && <p className="text-xs text-red-700 mt-1.5">{err.phone}</p>}
              </div>
            </div>
            <div className="mt-5">
              <label htmlFor="c-sub" className="block text-xs font-bold text-brand-green mb-1.5">विषय</label>
              <select id="c-sub" value={form.subject} onChange={e => set('subject', e.target.value)} className={IN}>
                <option>शिकायत / सुझाव</option>
                <option>प्रमाण-पत्र संबंधी</option>
                <option>योजना जानकारी</option>
                <option>अन्य</option>
              </select>
            </div>
            <div className="mt-5">
              <label htmlFor="c-msg" className="block text-xs font-bold text-brand-green mb-1.5">आपका संदेश *</label>
              <textarea id="c-msg" rows="4" value={form.msg} onChange={e => set('msg', e.target.value)} placeholder="अपनी बात यहां लिखें…" className={`${IN} resize-y`} />
              {err.msg && <p className="text-xs text-red-700 mt-1.5">{err.msg}</p>}
            </div>
            <button type="submit"
              className="mt-6 inline-flex items-center gap-2 bg-brand-saffron hover:bg-brand-saffronDark text-white font-bold px-7 py-3 rounded-xl shadow-lg shadow-brand-saffron/25 transition-colors">
              संदेश भेजें <Icon name="send" size={16} />
            </button>
            <p className="mt-4 text-xs text-ink/45">* आवश्यक जानकारी — यह डेमो फॉर्म है, डेटा कहीं भेजा नहीं जाता।</p>
          </form>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   FOOTER
   ============================================================ */
function Footer({ goTo, notify }) {
  const services = ['जन्म / मृत्यु पंजीकरण', 'भू-खसरा रिकॉर्ड', 'आय / निवास प्रमाण-पत्र', 'पेंशन आवेदन', 'मनरेगा जॉब कार्ड', 'शिकायत निवारण'];
  return (
    <footer className="bg-brand-deep text-white/75">
      <div className="h-1 flex" aria-hidden="true">
        <div className="flex-1 bg-brand-saffron" />
        <div className="flex-1 bg-white" />
        <div className="flex-1 bg-brand-leaf" />
      </div>
      <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-12 pb-8">
        <div className="grid gap-10 md:grid-cols-2 lg:grid-cols-[1.35fr_1fr_1fr_1.3fr]">
          <div>
            <div className="flex items-center gap-3">
              <Emblem size={46} />
              <div className="leading-tight">
                <p className="font-display text-xl text-white">सूर्यपुरा</p>
                <p className="text-[10px] tracking-[0.22em] font-semibold text-white/50 mt-1">ग्राम विकास पोर्टल</p>
              </div>
            </div>
            <p className="mt-4 text-sm leading-relaxed text-white/60">
              हमारा गांव, हमारा विकास, हमारी पहचान — गांव की सेवाएं, समाचार और विकास कार्य,
              सब एक ही जगह।
            </p>
            <div className="mt-5">
              <SocialIcons light notify={notify} />
            </div>
          </div>

          <nav aria-label="फुटर लिंक">
            <h4 className="text-sm font-bold text-white tracking-wider">पोर्टल लिंक</h4>
            <ul className="mt-4 space-y-2.5 text-sm">
              {NAV.map(n => (
                <li key={n.id}>
                  <button onClick={() => goTo(n.id)} className="text-white/60 hover:text-brand-saffronLight transition-colors inline-flex items-center gap-1.5 group">
                    <span className="w-1 h-1 rounded-full bg-brand-saffron/60 group-hover:bg-brand-saffron transition-colors" />
                    {n.label}
                  </button>
                </li>
              ))}
            </ul>
          </nav>

          <div>
            <h4 className="text-sm font-bold text-white tracking-wider">लोक सेवाएं</h4>
            <ul className="mt-4 space-y-2.5 text-sm">
              {services.map(s => (
                <li key={s}>
                  <button onClick={() => notify(`“${s}” सेवा इस डेमो पोर्टल में केवल प्रदर्शन हेतु सूचीबद्ध है।`)}
                    className="text-white/60 hover:text-brand-saffronLight transition-colors inline-flex items-center gap-1.5 group">
                    <span className="w-1 h-1 rounded-full bg-brand-saffron/60 group-hover:bg-brand-saffron transition-colors" />
                    {s}
                  </button>
                </li>
              ))}
            </ul>
          </div>

          <div>
            <h4 className="text-sm font-bold text-white tracking-wider">संपर्क व खबरें</h4>
            <ul className="mt-4 space-y-2.5 text-sm text-white/60">
              <li className="flex gap-2.5 items-start"><Icon name="mapPin" size={14} className="text-brand-saffronLight shrink-0 mt-0.5" />पंचायत भवन, सूर्यपुरा, जिला जयपुर (राज.)</li>
              <li className="flex gap-2.5 items-center"><Icon name="phone" size={14} className="text-brand-saffronLight shrink-0" />+91 9999888855</li>
              <li className="flex gap-2.5 items-center"><Icon name="mail" size={14} className="text-brand-saffronLight shrink-0" />gp.suryapura@example.in</li>
            </ul>
            <p className="mt-5 text-xs font-semibold text-white/50">गांव की खबरें सीधे ईमेल पर</p>
            <form className="mt-2.5 flex gap-2"
              onSubmit={e => {
                e.preventDefault();
                const v = e.target.elements.nlem.value.trim();
                if (v.includes('@') && v.includes('.')) { notify('सब्सक्रिप्शन दर्ज (डेमो) — धन्यवाद!'); e.target.reset(); }
                else notify('कृपया एक सही ईमेल पता लिखें।');
              }}>
              <input name="nlem" type="email" placeholder="आपका ईमेल" aria-label="ईमेल पता"
                className="flex-1 min-w-0 bg-white/10 border border-white/20 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder:text-white/40 focus:outline-none focus:border-brand-saffron transition" />
              <button type="submit" aria-label="सब्सक्राइब करें"
                className="bg-brand-saffron hover:bg-brand-saffronDark text-white rounded-xl px-4 flex items-center justify-center transition-colors shrink-0">
                <Icon name="send" size={16} />
              </button>
            </form>
          </div>
        </div>

        <div className="mt-10 pt-6 border-t border-white/10 flex flex-col md:flex-row items-center justify-between gap-3 text-xs text-white/45">
          <p>© 2026 ग्राम पंचायत सूर्यपुरा · जिला जयपुर, राजस्थान</p>
          <p className="text-center">यह एक काल्पनिक डेमो पोर्टल है — शैक्षणिक प्रदर्शन हेतु निर्मित।</p>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
            className="inline-flex items-center gap-1.5 text-white/60 hover:text-white transition-colors">
            ऊपर जाएं <Icon name="arrowUp" size={13} />
          </button>
        </div>
      </div>
    </footer>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [toast, setToast] = useState(null);
  const timer = useRef(null);
  const notify = msg => {
    setToast(msg);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(null), 3200);
  };

  const [active, setActive] = useState('home');
  const [newsIdx, setNewsIdx] = useState(null);
  const [projIdx, setProjIdx] = useState(null);
  const [agendaOpen, setAgendaOpen] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [search, setSearch] = useState({ open: false, q: '' });
  const [showTop, setShowTop] = useState(false);

  const goTo = id => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setActive(id);
  };

  /* Scroll-spy for nav highlighting */
  useEffect(() => {
    const ids = [...new Set([...NAV.map(n => n.id), 'social'])];
    const secs = ids.map(i => document.getElementById(i)).filter(Boolean);
    if (!secs.length) return;
    const obs = new IntersectionObserver(
      entries => entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }),
      { rootMargin: '-35% 0px -60% 0px' }
    );
    secs.forEach(s => obs.observe(s));
    return () => obs.disconnect();
  }, []);

  /* Back-to-top visibility */
  useEffect(() => {
    const h = () => setShowTop(window.scrollY > 600);
    window.addEventListener('scroll', h, { passive: true });
    h();
    return () => window.removeEventListener('scroll', h);
  }, []);

  const navLightbox = d => setLightbox(l => (l ? { ...l, index: (l.index + d + l.list.length) % l.list.length } : l));

  return (
    <>
      <TopStrip notify={notify} />
      <Header goTo={goTo} onSearch={v => setSearch({ open: true, q: v })} notify={notify} active={active} />
      <main>
        <Hero goTo={goTo} />
        <StatsBand />
        <QuickAccess goTo={goTo} />
        <News onOpen={setNewsIdx} />
        <Village
          onPlay={() => { notify('“गांव की झलक” डेमो में फोटो गैलरी के रूप में उपलब्ध है।'); goTo('gallery'); }}
          onAgenda={() => setAgendaOpen(true)} />
        <Projects onOpen={setProjIdx} />
        <Shiksha onNews={() => setNewsIdx(2)} goTo={goTo} />
        <Kisan notify={notify} />
        <SocialFeed notify={notify} />
        <Gallery onOpen={i => setLightbox({ list: GALLERY, index: i })} />
        <Contact notify={notify} />
      </main>
      <Footer goTo={goTo} notify={notify} />

      <BackToTop show={showTop} onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} />
      {toast && <Toast msg={toast} />}

      <SearchOverlay open={search.open} q={search.q} setQ={v => setSearch(s => ({ ...s, q: v }))}
        close={() => setSearch(s => ({ ...s, open: false }))} goTo={goTo} />
      <NewsModal idx={newsIdx} onClose={() => setNewsIdx(null)} notify={notify} />
      <ProjectModal idx={projIdx} onClose={() => setProjIdx(null)} goTo={goTo} />

      <Modal open={agendaOpen} onClose={() => setAgendaOpen(false)} wide="max-w-lg" label="पंचायत बैठक कार्यसूची">
        <div className="p-6 md:p-8">
          <div className="flex items-center gap-3">
            <span className="w-11 h-11 rounded-full bg-brand-green text-brand-saffronLight flex items-center justify-center shrink-0">
              <Icon name="calendar" size={20} />
            </span>
            <div>
              <p className="text-xs font-bold text-brand-saffron tracking-wider">ग्राम सभा · कार्यसूची</p>
              <h3 className="font-display text-2xl text-brand-green">अगली पंचायत बैठक</h3>
            </div>
          </div>
          <div className="mt-4 flex flex-wrap gap-2">
            <span className="text-xs font-semibold bg-brand-cream border border-brand-sand rounded-lg px-3 py-2 text-ink/70 flex items-center gap-1.5">
              <Icon name="calendar" size={12} className="text-brand-saffron" /> 15 नवंबर 2026 · प्रातः 11:00
            </span>
            <span className="text-xs font-semibold bg-brand-cream border border-brand-sand rounded-lg px-3 py-2 text-ink/70 flex items-center gap-1.5">
              <Icon name="mapPin" size={12} className="text-brand-saffron" /> पंचायत भवन, सूर्यपुरा
            </span>
          </div>
          <ul className="mt-6 space-y-3">
            {AGENDA.map((a, i) => (
              <li key={i} className="flex gap-3 items-start bg-brand-cream rounded-xl p-3.5 border border-brand-sand">
                <span className="w-6 h-6 rounded-full bg-brand-saffron text-white text-xs font-bold flex items-center justify-center shrink-0 mt-0.5">{i + 1}</span>
                <p className="text-[15px] text-ink/80 leading-relaxed">{a}</p>
              </li>
            ))}
          </ul>
          <p className="mt-5 text-xs text-ink/50">सभी ग्रामवासियों से निवेदन है कि वे समय पर उपस्थित हों। (डेमो सामग्री)</p>
        </div>
      </Modal>

      <Lightbox data={lightbox} onClose={() => setLightbox(null)} onNav={navLightbox} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
